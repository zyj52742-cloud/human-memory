[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-memory"
version = "0.4.0"
description = "类人脑记忆插件：分主次、会休眠、被提起才想起、可手动抢救"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "淡墨" }]
keywords = ["ai", "memory", "llm", "mcp", "agent"]
dependencies = []

[project.scripts]
memory-chat = "chat_play:main"
memory-mcp = "mcp_server:main"
memory-tune = "tune:main"
memory-selftest = "selftest:main"

[tool.setuptools]
py-modules = [
    "memory_core",
    "scoring",
    "extractor",
    "mcp_server",
    "chat_play",
    "tune",
    "selftest",
]
